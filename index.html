<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEA Travel Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const IconPlus = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconDownload = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y1="3"></line></svg>;
        const IconGlobe = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>;
        const IconCalendar = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconWallet = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4v-8Z"></path></svg>;

        const App = () => {
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('travel_expenses');
                return saved ? JSON.parse(saved) : [];
            });
            const [currency, setCurrency] = useState('THB'); 
            const [note, setNote] = useState('');
            const [amount, setAmount] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [rates, setRates] = useState(() => {
                const saved = localStorage.getItem('travel_rates');
                return saved ? JSON.parse(saved) : { THB: 37.18, VND: 30595 };
            });

            useEffect(() => localStorage.setItem('travel_expenses', JSON.stringify(expenses)), [expenses]);

            const handleAddExpense = (e) => {
                e.preventDefault();
                if (!amount || !note) return;
                const numAmount = parseFloat(amount);
                const amountEur = numAmount / rates[currency];
                const newExpense = { id: Date.now(), date, timestamp: Date.now(), note, amount: numAmount, currency, amountEur };
                setExpenses([newExpense, ...expenses]);
                setNote('');
                setAmount('');
            };

            const deleteExpense = (id) => {
                if(confirm("Delete this expense?")) setExpenses(expenses.filter(exp => exp.id !== id));
            };

            const exportCSV = () => {
                const headers = ['Date', 'Note', 'Currency', 'Amount (Local)', 'Amount (EUR)'];
                const rows = expenses.map(exp => [exp.date, `"${exp.note.replace(/"/g, '""')}"`, exp.currency, exp.amount.toFixed(2), exp.amountEur.toFixed(2)]);
                const blob = new Blob([[headers.join(','), ...rows.map(r => r.join(','))].join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'travel_expenses.csv';
                link.click();
            };

            const totalEur = expenses.reduce((sum, item) => sum + item.amountEur, 0);
            
            const groupedExpenses = useMemo(() => {
                const groups = {};
                expenses.forEach(expense => {
                    if (!groups[expense.date]) groups[expense.date] = [];
                    groups[expense.date].push(expense);
                });
                return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
            }, [expenses]);

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-800">
                    <div className="max-w-md w-full mx-auto bg-white shadow-xl min-h-screen flex flex-col">
                        <div className="bg-blue-600 text-white p-6 pb-8 rounded-b-3xl shadow-lg z-10">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-xl font-bold flex items-center gap-2"><IconGlobe size={20} /> SEA Travel Tracker</h1>
                                <button onClick={exportCSV} className="bg-blue-500/50 hover:bg-blue-500 p-2 rounded-full transition"><IconDownload size={18} /></button>
                            </div>
                            <div className="text-center"><p className="text-blue-200 text-xs font-bold uppercase tracking-widest mb-1">Total Spent</p><p className="text-5xl font-black tracking-tight">€{totalEur.toFixed(2)}</p></div>
                        </div>
                        <div className="px-6 -mt-6 z-20">
                            <div className="flex bg-white p-1.5 rounded-xl shadow-md border border-gray-100">
                                <button onClick={() => setCurrency('THB')} className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all ${currency === 'THB' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-600'}`}>🇹🇭 THB (฿)</button>
                                <button onClick={() => setCurrency('VND')} className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all ${currency === 'VND' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-600'}`}>🇻🇳 VND (₫)</button>
                            </div>
                        </div>
                        <form onSubmit={handleAddExpense} className="p-6 pt-4">
                            <div className="flex gap-3 mb-3">
                                <div className="w-1/3"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-2 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-600" /></div>
                                <div className="relative flex-1"><span className="absolute left-3 top-3 text-gray-400 font-medium">{currency === 'THB' ? '฿' : '₫'}</span><input type="number" step="any" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full pl-8 pr-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold text-lg" required /></div>
                            </div>
                            <div className="flex gap-3"><input type="text" placeholder="Description" value={note} onChange={(e) => setNote(e.target.value)} className="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium" required /><button type="submit" className="bg-blue-600 text-white w-14 rounded-xl hover:bg-blue-700 active:scale-95 transition-all shadow-md flex items-center justify-center"><IconPlus size={24} /></button></div>
                        </form>
                        <div className="flex-1 overflow-y-auto px-6 pb-10 space-y-6">
                            {expenses.length === 0 ? <div className="text-center text-gray-300 mt-12 flex flex-col items-center"><IconWallet size={64} className="mb-4 opacity-20" /><p className="font-medium">No expenses yet</p></div> : groupedExpenses.map(([dayDate, dailyExpenses]) => {
                                const dailyTotalEur = dailyExpenses.reduce((sum, item) => sum + item.amountEur, 0);
                                const uniqueCurrencies = [...new Set(dailyExpenses.map(item => item.currency))];
                                const isSingleCurrency = uniqueCurrencies.length === 1;
                                const dailyTotalLocal = isSingleCurrency ? dailyExpenses.reduce((sum, item) => sum + item.amount, 0) : 0;
                                return (
                                    <div key={dayDate}>
                                        <div className="flex justify-between items-center mb-2 px-1">
                                            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1">
                                                <IconCalendar size={12} />
                                                {new Date(dayDate).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}
                                            </h3>
                                            <div className="flex gap-2">
                                                {isSingleCurrency && (
                                                    <span className="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">
                                                        {uniqueCurrencies[0] === 'THB' ? '฿' : '₫'} {dailyTotalLocal.toLocaleString()}
                                                    </span>
                                                )}
                                                <span className="text-xs font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded-md">
                                                    €{dailyTotalEur.toFixed(2)}
                                                </span>
                                            </div>
                                        </div>
                                        <div className="bg-white border border-gray-100 rounded-2xl shadow-sm divide-y divide-gray-50 overflow-hidden">
                                            {dailyExpenses.map(expense => (
                                                <div key={expense.id} className="p-4 flex justify-between items-center group active:bg-gray-50">
                                                    <div className="flex-1 min-w-0 mr-4">
                                                        <div className="flex justify-between items-baseline mb-1">
                                                            <p className="font-bold text-gray-800 truncate text-sm">{expense.note}</p>
                                                            <span className="text-blue-600 font-bold text-sm">€{expense.amountEur.toFixed(2)}</span>
                                                        </div>
                                                        <div className="flex items-center gap-2 text-xs text-gray-400">
                                                            <span className="bg-gray-100 px-1.5 py-0.5 rounded text-gray-500 font-semibold">{expense.currency}</span>
                                                            <span>{expense.currency === 'THB' ? '฿' : '₫'} {expense.amount.toLocaleString()}</span>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => deleteExpense(expense.id)} className="text-gray-300 p-2 -mr-2 hover:text-red-500 transition-colors">
                                                        <IconTrash size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
